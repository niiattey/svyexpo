# Runs R CMD check on push and pull request. INLA comes from its own
# repository (extra-repositories) so the model tests run where it installs.
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: macos-latest, r: 'release'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
          extra-repositories: https://inla.r-inla-download.org/R/stable
      - uses: r-lib/actions/setup-r-dependencies@v2
        id: deps
        continue-on-error: true
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Wait before retrying (package index was unavailable)
        if: steps.deps.outcome == 'failure'
        run: sleep 60
        shell: bash
      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.deps.outcome == 'failure'
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
