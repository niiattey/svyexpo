# Runs the test suite directly (outside R CMD check) with INLA required, so
# the BYM2 / spatially varying coefficient code is always exercised on Linux
# and macOS. On some runners INLA's binary fails on graph models under
# R CMD check; this job shows whether the model code itself works.
on:
  push:
    branches: [main, master]
  pull_request:

name: model-tests

permissions: read-all

jobs:
  model-tests:
    runs-on: ${{ matrix.os }}
    name: model-tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      SVYEXPO_REQUIRE_INLA: "true"
      NOT_CRAN: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: https://inla.r-inla-download.org/R/stable
      - uses: r-lib/actions/setup-r-dependencies@v2
        id: deps
        continue-on-error: true
        with:
          extra-packages: any::devtools
          needs: check
      - name: Wait before retrying (package index was unavailable)
        if: steps.deps.outcome == 'failure'
        run: sleep 60
        shell: bash
      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.deps.outcome == 'failure'
        with:
          extra-packages: any::devtools
          needs: check
      - name: Run tests
        run: devtools::test(stop_on_failure = TRUE)
        shell: Rscript {0}
