# Builds the pkgdown documentation site and publishes it to the gh-pages
# branch. Enable it once in the repository: Settings > Pages > Source:
# "Deploy from a branch", branch "gh-pages", folder "/ (root)".
on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-24.04
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      # INLA is installed in its own step (below) with retries, because its
      # package index on Linux sometimes returns an invalid response and that
      # breaks the dependency resolver for every package.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: >-
            any::pkgdown, local::., any::knitr, any::rmarkdown,
            any::ggplot2, any::withr, any::sn
          needs: website
      - name: Install INLA (with retries)
        run: |
          repos <- c(INLA = "https://inla.r-inla-download.org/R/stable",
                     CRAN = "https://cloud.r-project.org")
          for (i in 1:5) {
            try(install.packages("INLA", repos = repos))
            if (requireNamespace("INLA", quietly = TRUE)) break
            message("INLA install attempt ", i, " failed; retrying in 30 s")
            Sys.sleep(30)
          }
          stopifnot(requireNamespace("INLA", quietly = TRUE))
        shell: Rscript {0}
      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
