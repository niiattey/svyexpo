# Runs R CMD check on push and pull request.
#
# INLA is not on CRAN. It is installed in its own step with retries instead of
# through the dependency resolver, because INLA's package index on Linux
# sometimes returns an invalid response and that breaks resolution of every
# other package.
#
# On Linux and macOS, INLA's program fails on graph models inside R CMD check
# (see README, "Known issue"), so the package skips model fitting there. The
# model-tests workflow runs those tests outside R CMD check.
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-24.04, r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: macos-latest, r: 'release'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: >-
            any::rcmdcheck, any::testthat, any::knitr, any::rmarkdown,
            any::ggplot2, any::withr, any::sn
      - name: Install INLA (with retries)
        run: |
          repos <- c(INLA = "https://inla.r-inla-download.org/R/stable",
                     CRAN = "https://cloud.r-project.org")
          for (i in 1:5) {
            try(install.packages("INLA", repos = repos))
            if (requireNamespace("INLA", quietly = TRUE)) break
            message("INLA install attempt ", i, " failed; retrying in 30 s")
            Sys.sleep(30)
          }
          stopifnot(requireNamespace("INLA", quietly = TRUE))
        shell: Rscript {0}
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
