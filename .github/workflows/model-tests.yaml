# Runs the test suite directly (outside R CMD check) with INLA required, so
# the BYM2 / spatially varying coefficient code is always exercised on Linux
# and macOS. On those systems INLA's program fails on graph models inside
# R CMD check; this job shows whether the model code itself works.
on:
  push:
    branches: [main, master]
  pull_request:

name: model-tests

permissions: read-all

jobs:
  model-tests:
    runs-on: ${{ matrix.os }}
    name: model-tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      SVYEXPO_REQUIRE_INLA: "true"
      NOT_CRAN: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: >-
            any::devtools, any::testthat, any::knitr, any::rmarkdown,
            any::ggplot2, any::withr, any::sn
      - name: Install INLA (with retries)
        run: |
          repos <- c(INLA = "https://inla.r-inla-download.org/R/stable",
                     CRAN = "https://cloud.r-project.org")
          for (i in 1:5) {
            try(install.packages("INLA", repos = repos))
            if (requireNamespace("INLA", quietly = TRUE)) break
            message("INLA install attempt ", i, " failed; retrying in 30 s")
            Sys.sleep(30)
          }
          stopifnot(requireNamespace("INLA", quietly = TRUE))
        shell: Rscript {0}
      - name: Run tests
        run: devtools::test(stop_on_failure = TRUE)
        shell: Rscript {0}
